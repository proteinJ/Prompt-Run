<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Prompt Run - 관리자 페이지</title>
    <link rel="stylesheet" href="admin-style.css">

    <script>
        (function() {
            const token = localStorage.getItem('accessToken');
            if (!token) {
                alert("관리자 로그인이 필요합니다.");
                window.location.href = '/';
            }
        })();
    </script>
</head>
<body>

<nav>
    <h2 class="nav-title">ADMIN</h2>
    <button onclick="showSection('member-sec')" class="nav-btn active">👥 회원 관리</button>
    <button onclick="showSection('quiz-sec')" class="nav-btn">🧩 퀴즈 관리</button>
    <button onclick="showSection('config-sec')" class="nav-btn">⚙️ 게임 설정</button>
    <button onclick="showSection('sandbox-sec')" class="nav-btn">🧪 프롬프트 실험실</button>
        
    <button onclick="location.href='/'" class="nav-btn back-btn">🔙 게임으로</button>
</nav>

<main>
    <div id="member-sec" class="section active">
        <h2>회원 목록 조회</h2>
        <button class="action-btn" onclick="loadMembers()">새로고침</button>
        <div class="table-container">
            <table id="member-table">
                <thead><tr><th>ID</th><th>Username</th><th>Nickname</th><th>Role</th><th>가입일</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="quiz-sec" class="section">
        <h2>퀴즈 관리</h2>

        <div class="card form-container">
            <h3>새 퀴즈 추가</h3>
            <div class="form-group"><input id="q-question" placeholder="문제 내용"></div>
            <div class="form-group"><input id="q-choices" placeholder="선택지 (예: 1. A | 2. B | 3. C)"></div>
            <div class="form-group"><input id="q-answer" placeholder="정답 (예: 1)"></div>
            <button class="action-btn" onclick="addQuiz()">추가하기</button>
        </div>

        <button class="action-btn" onclick="loadQuizzes()">목록 새로고침</button>

        <div class="table-container">
            <table id="quiz-table">
                <thead><tr><th>ID</th><th>문제</th><th>선택지</th><th>정답</th><th>관리</th></tr></thead>
                <tbody></tbody>
            </table>
        </div>
    </div>

    <div id="config-sec" class="section">
        <h2>게임 설정</h2>
        <div class="card form-container small-card">
            <h3>최대 턴(Turn) 수 조정</h3>
            <p class="info-text">현재 설정된 값: <span id="current-turn-val" class="highlight-text">-</span></p>
            <div class="form-group">
                <input type="number" id="config-turn" placeholder="새로운 턴 수 입력 (예: 15)">
            </div>
            <button class="action-btn" onclick="updateTurnConfig()">저장</button>
        </div>
    </div>

    <div id="sandbox-sec" class="section">
        <h2>🧪 AI 프롬프트 실험실 (Sandbox)</h2>
        <div class="card">
            <p class="info-text">게임에 적용하기 전, AI의 반응을 미리 테스트하는 <strong>디버깅 도구</strong>입니다.</p>

            <div class="form-group">
                <label style="display:block; margin-bottom:5px; color:#aaa;">System Instruction (시스템 지시사항)</label>
                <textarea id="sb-system" rows="3" placeholder="예: 너는 사악한 마왕이다. 짧게 대답해라."></textarea>
            </div>

            <div class="form-group">
                <label style="display:block; margin-bottom:5px; color:#aaa;">User Input (사용자 입력)</label>
                <input id="sb-user" placeholder="예: 안녕? 넌 누구니?">
            </div>

            <button class="action-btn" onclick="testPrompt()">🚀 테스트 실행</button>
        </div>

        <div class="card" id="sb-result-card" style="display:none; background:#111; border:1px solid #444;">
            <h3 style="color:#4CAF50;">Response (JSON Raw Data)</h3>
            <pre id="sb-result" style="color:#ddd; white-space: pre-wrap; font-family: monospace;"></pre>
        </div>
    </div>
</main>

<script src="admin-script.js"></script>
</body>
</html>
